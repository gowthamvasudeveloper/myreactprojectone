services:
  mysql:
    image: mysql:8.4
    container_name: expense_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expense_db}
      MYSQL_USER: ${MYSQL_USER:-expense_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-expense_password}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-expense_user}", "-p${MYSQL_PASSWORD:-expense_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Expense Manager API}
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: /api/v1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-real-env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-expense_user}:${MYSQL_PASSWORD:-expense_password}@mysql:3306/${MYSQL_DATABASE:-expense_db}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: expense_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-expense_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-expense_password}
    ports:
      - "${PHPMYADMIN_HOST_PORT:-8080}:80"

volumes:
  mysql_data:

